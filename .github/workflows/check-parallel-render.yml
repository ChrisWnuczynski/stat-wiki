# Temporary check, to be deleted: render the site with render_site.py and with
# a plain quarto render, time both, and compare the two _site folders.
name: Check parallel render

on:
  push:
    branches: [claude/kind-maxwell-5gerw5]

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils fonts-liberation
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.6.40
      - run: python build_wiki.py

      - name: Parallel render
        run: |
          echo "cores: $(nproc)"
          start=$(date +%s)
          python render_site.py
          echo "PARALLEL_SECONDS=$(( $(date +%s) - start ))"
          mv _site _site_parallel

      - name: Plain render
        run: |
          start=$(date +%s)
          quarto render
          echo "SERIAL_SECONDS=$(( $(date +%s) - start ))"

      - name: Compare
        shell: python
        run: |
          import filecmp, json, sys
          from pathlib import Path
          from xml.etree import ElementTree
          a, b = Path("_site_parallel"), Path("_site")
          fa = {p.relative_to(a).as_posix() for p in a.rglob("*") if p.is_file()}
          fb = {p.relative_to(b).as_posix() for p in b.rglob("*") if p.is_file()}
          print("files: parallel", len(fa), "plain", len(fb))
          print("only parallel:", sorted(fa - fb)[:20], len(fa - fb))
          print("only plain:", sorted(fb - fa)[:20], len(fb - fa))
          special = {"search.json", "sitemap.xml"}
          diff = [f for f in sorted(fa & fb - special) if not filecmp.cmp(a / f, b / f, shallow=False)]
          print("different files:", len(diff), diff[:20])
          if diff:
              import difflib
              x = (a / diff[0]).read_text(errors="replace").splitlines()
              y = (b / diff[0]).read_text(errors="replace").splitlines()
              print("\n".join(list(difflib.unified_diff(y, x, "plain", "parallel", lineterm=""))[:60]))
          sa = {d["objectID"]: d for d in json.loads((a / "search.json").read_text())}
          sb = {d["objectID"]: d for d in json.loads((b / "search.json").read_text())}
          sdiff = [k for k in sa.keys() | sb.keys() if sa.get(k) != sb.get(k)]
          print("search entries: parallel", len(sa), "plain", len(sb), "different", len(sdiff), sdiff[:10])
          ns = "{http://www.sitemaps.org/schemas/sitemap/0.9}"
          def urls(p):
              return {(u.findtext(ns + "loc"), u.findtext(ns + "lastmod")) for u in ElementTree.parse(p).getroot()}
          ua, ub = urls(a / "sitemap.xml"), urls(b / "sitemap.xml")
          print("sitemap: parallel", len(ua), "plain", len(ub), "different", len(ua ^ ub), sorted(ua ^ ub)[:6])
          sys.exit(1 if (fa ^ fb or diff or sdiff or ua ^ ub) else 0)
