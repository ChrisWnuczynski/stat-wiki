# Build the wiki and publish it on every push to main.
# The same steps work locally: python build_wiki.py, then quarto render.
# A pull request runs the page build and the graph tests. It does not render or deploy.
name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time. Pull-request checks use their own group.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('wiki-graph-run-{0}', github.ref) || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install distribution plotting packages
        run: python -m pip install matplotlib==3.10.8 scipy==1.17.0

      # pdfinfo and pdftocairo turn the PDF figures into PNGs.
      - name: Install poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils fonts-liberation

      # Same Quarto version as the local build, so pages come out the same.
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.6.40

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the laboratory modules
        run: node --test labs/kde-math.test.mjs labs/stat-math.test.mjs labs/beta-binomial-math.test.mjs labs/markov-math.test.mjs labs/coverage-math.test.mjs labs/distribution-explorer-math.test.mjs labs/svg-chart.test.mjs labs/distribution-explorer.test.mjs

      - name: Check the R runner
        run: node --test webr/packages.test.mjs webr/runner.test.mjs

      - name: Check search ranking
        run: node --test search-rank.test.mjs

      # The Ask StatWiki launcher and chat, served from ask/widget/dist.
      - name: Build the Ask widget
        working-directory: ask/widget
        run: |
          npm ci
          npm run build

      - name: Write the wiki pages
        run: python build_wiki.py

      - name: Render the site
        run: quarto render

      - id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}

  # Publish the site through the Pages deployment API.
  #
  # actions/deploy-pages stops at ten minutes and then cancels. A site this
  # size stays in "syncing files" longer than that, and cancelling leaves the
  # deployment named after the commit in a state where a re-run only sees an
  # empty status. This step waits longer and does not cancel.
  #
  # pages_build_version has to be the commit SHA. The API returns 404 for any
  # other string, including one with the run id appended.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/github-script@v8
        env:
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
            const failed = ['deployment_failed', 'deployment_perms_error', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost'];
            const waitMinutes = 45;
            const artifactId = Number(process.env.ARTIFACT_ID);
            if (!artifactId) {
              core.setFailed('The build job did not pass an artifact id.');
              return;
            }
            let oidc;
            try {
              oidc = await core.getIDToken();
            } catch (error) {
              core.setFailed(`Could not get an OIDC token: ${error.message}`);
              return;
            }
            let data;
            try {
              ({ data } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
                owner, repo,
                artifact_id: artifactId,
                pages_build_version: context.sha,
                oidc_token: oidc,
              }));
            } catch (error) {
              const body = error.response?.data ? JSON.stringify(error.response.data) : '';
              core.setFailed(`Could not create a Pages deployment (HTTP ${error.status || '?'}): ${error.message} ${body}`.trim());
              return;
            }
            const id = data.id || (data.status_url || '').split('/').pop() || context.sha;
            core.info(`Deployment ${id} for ${context.sha}, artifact ${artifactId}`);
            const start = Date.now();
            let status = '';
            while (Date.now() - start < waitMinutes * 60000) {
              await sleep(15000);
              try {
                const res = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}', {
                  owner, repo, pages_deployment_id: String(id),
                });
                status = res.data.status || '';
              } catch (error) {
                core.warning(`Could not read the deployment status (HTTP ${error.status || '?'}): ${error.message}`);
                continue;
              }
              core.info(`${Math.round((Date.now() - start) / 1000)} s: ${status || 'no status yet'}`);
              if (status === 'succeed') {
                core.setOutput('page_url', data.page_url || '');
                return;
              }
              if (failed.includes(status)) {
                core.setFailed(`GitHub Pages deployment ${id} ended with status ${status}.`);
                return;
              }
            }
            core.setFailed(`GitHub Pages deployment ${id} was still ${status ? '"' + status + '"' : 'without a status'} after ${waitMinutes} minutes. It was left running so a sync in progress can finish.`);

  # After Pages reports success, drop the Cloudflare cache for www.statwiki.io.
  # The site is proxied with a long edge TTL, so the previous HTML would keep
  # being served. This job runs only when deploy succeeds: a push or a manual
  # run on main, never a pull request.
  #
  # CLOUDFLARE_PURGE_TOKEN does not exist yet. An empty token skips the call.
  # A failed purge warns and exits 0. Index Ask StatWiki runs only after this
  # workflow succeeds, so a cache error must not fail the run.
  purge:
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Purge Cloudflare cache
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}
          ZONE: ${{ vars.CLOUDFLARE_ZONE_ID || 'e3a85f1ac0453d54d2f1394d7f720b49' }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::notice::CLOUDFLARE_PURGE_TOKEN not set; skipping Cloudflare cache purge"
            exit 0
          fi
          echo "Waiting 30 seconds for GitHub Pages to finish rolling out."
          sleep 30
          errfile="$(mktemp)"
          trap 'rm -f "${errfile}"' EXIT
          set +e
          body="$(curl -sS --max-time 60 -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE}/purge_cache" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'Content-Type: application/json' \
            --data '{"purge_everything":true}' 2>"${errfile}")"
          status=$?
          set -e
          if [ "${status}" -ne 0 ]; then
            err="$(tr '\n' ' ' < "${errfile}")"
            echo "::warning::Cloudflare cache purge request failed (curl exit ${status}): ${err}"
            exit 0
          fi
          # Cloudflare prints "success": true with a space. Parse the boolean.
          report="$(printf '%s' "${body}" | python3 -c '
          import json, os, sys
          raw = sys.stdin.read()
          token = os.environ.get("TOKEN", "")
          def redact(text):
              text = " ".join(text.split())
              if token:
                  text = text.replace(token, "[redacted]")
              return text[:500]
          try:
              data = json.loads(raw)
          except json.JSONDecodeError:
              print("fail " + redact(raw))
              raise SystemExit(0)
          if data.get("success") is True:
              print("ok")
              raise SystemExit(0)
          parts = []
          for err in data.get("errors") or []:
              if isinstance(err, dict):
                  message = str(err.get("message") or "")
                  code = err.get("code")
                  parts.append(f"{code}: {message}".strip() if code is not None else message)
              else:
                  parts.append(str(err))
          detail = "; ".join(part for part in parts if part) or raw
          print("fail " + redact(detail))
          ')" || report="fail could not read the Cloudflare response"
          if [ "${report}" = "ok" ]; then
            echo "Cloudflare cache purge succeeded for zone ${ZONE}."
            exit 0
          fi
          echo "::warning::Cloudflare cache purge failed: ${report#fail }"
          exit 0

  # Pull requests only. The maths modules and the R runner do not need a browser
  # or an install: they import local files.
  labs:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the laboratory modules and the R runner
        run: |
          node --test labs/kde-math.test.mjs labs/stat-math.test.mjs labs/beta-binomial-math.test.mjs labs/markov-math.test.mjs labs/coverage-math.test.mjs labs/distribution-explorer-math.test.mjs labs/svg-chart.test.mjs labs/distribution-explorer.test.mjs
          node --test webr/packages.test.mjs webr/runner.test.mjs
          node --test search-rank.test.mjs

  # Pull requests only. Poppler converts figures and Quarto supplies pandoc.
  # This job does not render the site and does not deploy it.
  graph:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: wiki-graph-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install distribution plotting packages
        run: python -m pip install matplotlib==3.10.8 scipy==1.17.0 sympy==1.14.0 scikit-learn==1.6.1

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.0"

      - name: Install the R packages used by the page checks
        run: |
          Rscript -e 'install.packages(c("https://cran.r-project.org/src/contrib/Archive/mgcv/mgcv_1.9-3.tar.gz", "https://cran.r-project.org/src/contrib/Archive/rpart/rpart_4.1.24.tar.gz"), repos = NULL, type = "source"); stopifnot(packageVersion("mgcv") == "1.9.3", packageVersion("rpart") == "4.1.24")'

      - name: Install the SVM and GEE packages used by the page checks
        run: |
          Rscript -e 'install.packages(c("https://cran.r-project.org/src/contrib/Archive/proxy/proxy_0.4-27.tar.gz", "https://cran.r-project.org/src/contrib/Archive/e1071/e1071_1.7-13.tar.gz", "https://cran.r-project.org/src/contrib/Archive/gee/gee_4.13-25.tar.gz"), repos = NULL, type = "source"); stopifnot(packageVersion("proxy") == "0.4.27", packageVersion("e1071") == "1.7.13", packageVersion("gee") == "4.13.25")'

      - name: Install forecast 8.21.1 for the seasonal ARIMA check
        run: |
          sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
          Rscript - <<'RS'
          repos_old <- "https://packagemanager.posit.co/cran/2023-09-15"
          deps <- c("colorspace", "fracdiff", "generics", "ggplot2", "lmtest", "magrittr",
                    "nnet", "Rcpp", "RcppArmadillo", "timeDate", "urca", "zoo")
          install.packages(deps, repos = repos_old, type = "source",
                           dependencies = c("Depends", "Imports", "LinkingTo"))
          # tseries 0.10-54 from that snapshot does not compile on R 4.5.
          install.packages("tseries", repos = "https://cloud.r-project.org", type = "source",
                           dependencies = c("Depends", "Imports", "LinkingTo"))
          install.packages(
            "https://cran.r-project.org/src/contrib/Archive/forecast/forecast_8.21.1.tar.gz",
            repos = NULL, type = "source")
          stopifnot(packageVersion("forecast") == "8.21.1")
          RS

      - name: Install poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils fonts-liberation

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.6.40

      - name: Write the wiki pages
        run: python build_wiki.py

      - name: Check overview links
        run: python check_overview_links.py

      - name: Test citations
        run: python -m unittest test_citations.py

      - name: Test the graph
        run: python -m unittest test_wiki_graph.py

  # Pull requests only: the Ask worker and harness tests, and the chat widget's
  # type check, unit tests and browser tests against a stand-in Worker.
  ask:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test the Ask worker and harness
        working-directory: ask
        run: |
          npm ci
          npm test

      - name: Test the Ask widget
        working-directory: ask/widget
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm test
          npx playwright install --with-deps chromium
          npm run e2e
