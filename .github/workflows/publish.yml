# Build the wiki and publish it to GitHub Pages on every push to main.
# The same steps work locally: python build_wiki.py, then quarto render.
name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time. A newer push waits for the running one to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # pdfinfo and pdftocairo turn the PDF figures into PNGs.
      - name: Install poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils fonts-liberation

      # Same Quarto version as the local build, so pages come out the same.
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.6.40

      - name: Write the wiki pages
        run: python build_wiki.py

      - name: Render the site
        run: quarto render

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
