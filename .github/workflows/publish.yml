# Build the wiki and publish it on every push to main.
# The same steps work locally: python build_wiki.py, then quarto render.
# A pull request runs the page build and the graph tests. It does not render or deploy.
name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time. Pull-request checks use their own group.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('wiki-graph-run-{0}', github.ref) || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # pdfinfo and pdftocairo turn the PDF figures into PNGs.
      - name: Install poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils fonts-liberation

      # Same Quarto version as the local build, so pages come out the same.
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.6.40

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the laboratory modules
        run: node --test labs/kde-math.test.mjs labs/stat-math.test.mjs labs/beta-binomial-math.test.mjs labs/markov-math.test.mjs labs/coverage-math.test.mjs

      - name: Check the R runner
        run: node --test webr/packages.test.mjs webr/runner.test.mjs

      - name: Check search ranking
        run: node --test search-rank.test.mjs

      # The Ask StatWiki launcher and chat, served from ask/widget/dist.
      - name: Build the Ask widget
        working-directory: ask/widget
        run: |
          npm ci
          npm run build

      - name: Write the wiki pages
        run: python build_wiki.py

      - name: Render the site
        run: quarto render

      - id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}

  # Publish the site through the Pages deployment API.
  #
  # actions/deploy-pages stops at ten minutes and then cancels. A site this
  # size stays in "syncing files" longer than that, and cancelling leaves the
  # deployment named after the commit in a state where a re-run only sees an
  # empty status. This step waits longer and does not cancel.
  #
  # pages_build_version has to be the commit SHA. The API returns 404 for any
  # other string, including one with the run id appended.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/github-script@v8
        env:
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
            const failed = ['deployment_failed', 'deployment_perms_error', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost'];
            const waitMinutes = 45;
            const artifactId = Number(process.env.ARTIFACT_ID);
            if (!artifactId) {
              core.setFailed('The build job did not pass an artifact id.');
              return;
            }
            let oidc;
            try {
              oidc = await core.getIDToken();
            } catch (error) {
              core.setFailed(`Could not get an OIDC token: ${error.message}`);
              return;
            }
            let data;
            try {
              ({ data } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
                owner, repo,
                artifact_id: artifactId,
                pages_build_version: context.sha,
                oidc_token: oidc,
              }));
            } catch (error) {
              const body = error.response?.data ? JSON.stringify(error.response.data) : '';
              core.setFailed(`Could not create a Pages deployment (HTTP ${error.status || '?'}): ${error.message} ${body}`.trim());
              return;
            }
            const id = data.id || (data.status_url || '').split('/').pop() || context.sha;
            core.info(`Deployment ${id} for ${context.sha}, artifact ${artifactId}`);
            const start = Date.now();
            let status = '';
            while (Date.now() - start < waitMinutes * 60000) {
              await sleep(15000);
              try {
                const res = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}', {
                  owner, repo, pages_deployment_id: String(id),
                });
                status = res.data.status || '';
              } catch (error) {
                core.warning(`Could not read the deployment status (HTTP ${error.status || '?'}): ${error.message}`);
                continue;
              }
              core.info(`${Math.round((Date.now() - start) / 1000)} s: ${status || 'no status yet'}`);
              if (status === 'succeed') {
                core.setOutput('page_url', data.page_url || '');
                return;
              }
              if (failed.includes(status)) {
                core.setFailed(`GitHub Pages deployment ${id} ended with status ${status}.`);
                return;
              }
            }
            core.setFailed(`GitHub Pages deployment ${id} was still ${status ? '"' + status + '"' : 'without a status'} after ${waitMinutes} minutes. It was left running so a sync in progress can finish.`);

  # Pull requests only. The maths modules and the R runner do not need a browser
  # or an install: they import local files.
  labs:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the laboratory modules and the R runner
        run: |
          node --test labs/kde-math.test.mjs labs/stat-math.test.mjs labs/beta-binomial-math.test.mjs labs/markov-math.test.mjs labs/coverage-math.test.mjs
          node --test webr/packages.test.mjs webr/runner.test.mjs
          node --test search-rank.test.mjs

  # Pull requests only. Poppler converts figures and Quarto supplies pandoc.
  # This job does not render the site and does not deploy it.
  graph:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: wiki-graph-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils fonts-liberation

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.6.40

      - name: Write the wiki pages
        run: python build_wiki.py

      - name: Test the graph
        run: python -m unittest test_wiki_graph.py

  # Pull requests only: the Ask worker and harness tests, and the chat widget's
  # type check, unit tests and browser tests against a stand-in Worker.
  ask:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test the Ask worker and harness
        working-directory: ask
        run: |
          npm ci
          npm test

      - name: Test the Ask widget
        working-directory: ask/widget
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm test
          npx playwright install --with-deps chromium
          npm run e2e
